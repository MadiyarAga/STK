[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "stk_project.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = [
    "--ds=stk_project.settings.test",
    "--reuse-db",
    "--strict-markers",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"stk_project/settings/*.py" = ["F403", "F405"]

[tool.coverage.run]
source = ["apps", "stk_project"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
show_missing = true